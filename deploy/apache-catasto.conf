# Apache 2.4.47 o successivo – variante A: nome dedicato (es. https://catasto.dipartimento.it/)
# Moduli: sudo a2enmod ssl proxy proxy_http proxy_wstunnel headers
# Copiare in /etc/apache2/sites-available/catasto.conf, poi: sudo a2ensite catasto && sudo apache2ctl configtest && sudo systemctl reload apache2
# Sostituire ServerName e i percorsi dei certificati.

<VirtualHost *:80>
    ServerName catasto.dipartimento.it
    Redirect permanent / https://catasto.dipartimento.it/
</VirtualHost>

<VirtualHost *:443>
    ServerName catasto.dipartimento.it

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/catasto.crt
    SSLCertificateKeyFile /etc/ssl/private/catasto.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 86400
    # upgrade=websocket inoltra anche il WebSocket di Streamlit
    ProxyPass        / http://127.0.0.1:8501/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:8501/
</VirtualHost>

# Apache – variante B: sottocartella di un sito esistente (es. https://www.dipartimento.it/catasto/)
# Avviare Streamlit con --server.baseUrlPath catasto e aggiungere nel VirtualHost del sito:
#
#    ProxyPass        /catasto/ http://127.0.0.1:8501/catasto/ upgrade=websocket
#    ProxyPassReverse /catasto/ http://127.0.0.1:8501/catasto/
