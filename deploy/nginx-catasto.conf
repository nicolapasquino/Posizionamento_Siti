# nginx – variante A: nome dedicato (es. https://catasto.dipartimento.it/)
# Copiare in /etc/nginx/sites-available/catasto, collegare in sites-enabled, poi: sudo nginx -t && sudo systemctl reload nginx
# Sostituire server_name e i percorsi dei certificati.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name catasto.dipartimento.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name catasto.dipartimento.it;

    ssl_certificate     /etc/ssl/certs/catasto.crt;
    ssl_certificate_key /etc/ssl/private/catasto.key;

    client_max_body_size 10m;          # come server.maxUploadSize (il default di nginx è 1 MB)

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;            # WebSocket di Streamlit
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;                           # la connessione WebSocket resta aperta a lungo
        proxy_buffering off;
    }
}

